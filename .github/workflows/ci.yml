name: CI

# The performance guard. `npm run build` enforces the bundle budget (Vercel
# runs it too, so a regression cannot deploy), and the paint check runs here
# because it needs a browser, which Vercel's builder does not have.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Fails if First Load JS on any budgeted route is over its ceiling.
      # See scripts/perf-budget.mjs.
      - name: Build (enforces the bundle budget)
        run: npm run build

      # Fails if / or /login never records a first-contentful-paint — the
      # signature of content hidden behind an entrance animation.
      - name: Paint check
        run: npm run check:paint
        env:
          PERF_CHROME_PATH: /usr/bin/google-chrome
