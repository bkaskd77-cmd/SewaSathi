name: CI

# The performance guard, plus the translation guard. `npm run build` enforces
# the bundle budget (Vercel runs it too, so a regression cannot deploy); the
# paint check runs here because it needs a browser, which Vercel's builder does
# not have; and the message check catches a key that exists in one language and
# not the other, which next-intl renders as a raw key path rather than failing.
#
# TWO JOBS, AND THE SPLIT IS THE LESSON. The advisory gate used to be the sixth
# step of this one job. On 2026-09-10 a CRITICAL advisory landed in Next 14,
# fixable only by the Next 16 major upgrade — so that step failed, and every
# step below it stopped running: lint, typecheck, the message and transition
# checks, the tests, the build, the paint check, the flow check. Nine days and
# seventy-one runs, all red at 37 seconds, while the notification emails kept
# arriving and said nothing about which check had actually failed.
#
# A check that cannot pass must not be able to silence the checks that can. So
# the advisories run in a job of their own: `verify` going red now means
# something is wrong with the code, which is the only reason to look at it.
on:
  push:
    branches: ["**"]
  pull_request:
  # RUNNABLE ON DEMAND, AND THE REASON IS ENVIRONMENT VARIABLES.
  #
  # `NEXT_PUBLIC_*` is inlined into the bundle at BUILD time, so setting one in
  # the Vercel dashboard changes nothing until something rebuilds — and the
  # symptom is the feature silently staying off, which reads as "the variable
  # did not work". Until now the only way to rebuild was a commit, so picking
  # up a key somebody had just set meant either an empty commit (which this
  # repository refuses) or asking them to press Redeploy (which CLAUDE.md
  # refuses, because a push is the deploy).
  #
  # This closes that: a deploy can now be asked for without inventing a commit,
  # and it runs the same `verify` and the same post-deploy walk as any other
  # run, so an on-demand deploy is never a less-checked one.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Fails if en.json and ne.json disagree on a key or a placeholder.
      - name: Message catalogues
        run: npm run check:messages

      # The other half, and the half that caught a key path printed onto a
      # live admin screen: a key absent from BOTH catalogues agrees perfectly,
      # so check:messages passes it. This resolves every t() call through the
      # TypeScript AST and asserts the copy exists.
      - name: Message keys
        run: npm run check:keys

      # The status machine exists in TypeScript and in SQL. This fails if they
      # ever disagree about what a booking may do.
      - name: Status transitions
        run: npm run check:transitions

      # Unit tests plus the database suite. The db half stands up a throwaway
      # Postgres and applies the real migrations, so RLS isolation between two
      # customers is asserted against actual policies rather than a mock.
      # ubuntu-latest ships the server binaries; the harness drops to the
      # unprivileged `postgres` account because Postgres refuses to run as root.
      - name: Tests
        run: npm run test

      # Reports the register of mock claims still on the live site. Only a
      # build failure when LAUNCH=true and NODE_ENV=production, so CI sees the
      # list without blocking ordinary work.
      - name: Launch blockers
        run: npm run check:blockers

      - name: Build
        run: npm run build

      # THE BUNDLE BUDGET MOVED HERE FROM INSIDE THE BUILD, and it matters where it
      # lives. Next 16 deleted the Size and First Load JS columns from `next build`
      # output under both builders, so there is nothing left to parse; the check loads
      # each budgeted route in a real Chromium and counts the script bytes transferred.
      # That needs a browser, and Vercel's builder has none — so a regression is caught
      # here, before merge, rather than by the deploy refusing to build.
      # See LAUNCH-BLOCKERS.md § ci-gates-deploy.
      - name: Bundle budget
        run: npm run check:bundle
        env:
          PERF_CHROME_PATH: /usr/bin/google-chrome

      # Fails if any front door, in either language, never records a
      # first-contentful-paint — the signature of content hidden behind an
      # entrance animation.
      - name: Paint check
        run: npm run check:paint
        env:
          PERF_CHROME_PATH: /usr/bin/google-chrome

      # The booking funnel in a real browser: the logged-out customer who fills
      # in three screens, signs in, and must come back to all of it.
      - name: Booking flows
        run: npm run check:flows

  # ---------------------------------------------------------------------------
  # Asking Vercel to deploy, once the checks above have passed
  # ---------------------------------------------------------------------------
  #
  # THE PUSH NO LONGER TRIGGERS THE PRODUCTION DEPLOY — THIS DOES.
  # `scripts/vercel-ignore-build.mjs` refuses a commit whose CI is not green, and on its
  # own it refused everything: Vercel starts building seconds after a push, before GitHub
  # has registered one check run, so four green commits produced four CANCELED production
  # deployments and nothing anywhere said so. A Vercel deploy hook called from here fires
  # when the checks exist and pass, and the gate then finds them and builds.
  #
  # A JOB OF ITS OWN RATHER THAN A LAST STEP OF `verify`, which was the first version and
  # was wrong in a way worth recording. This step goes RED when no deploy hook is
  # configured — deliberately, because a warning leaves a green tick beside a frozen
  # production. As a step inside `verify` that redness made `verify` itself red, which the
  # gate reads as "nobody has shown this commit is good" — so it would also have refused a
  # manual redeploy, taking away the one escape hatch while complaining about the lack of
  # an automatic one. Split out, `verify` stays honest about the code and this job carries
  # the deploy's own problem.
  #
  # It is in the gate's NON_BLOCKING set, and that is structural rather than a convenience:
  # this job IS the deploy, so counting it would ask whether a commit had already deployed
  # before allowing it to. It is also still running at the moment Vercel evaluates the
  # gate, which on its own would skip every build for ever.
  #
  # The branch is decided inside the script rather than with an `if:` here, so the
  # production branch is written down in exactly one place.
  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ask Vercel to deploy
        run: node scripts/trigger-deploy.mjs
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

      # ----------------------------------------------------------------------
      # And then check that it landed, HERE rather than on a deployment event.
      # ----------------------------------------------------------------------
      #
      # WHY NOT IN `after-deploy.yml`, WHICH IS WHERE THESE TWO LIVED. That
      # workflow triggered on `deployment_status`, the event Vercel's git
      # integration emits — and a push does not deploy this project, because the
      # ignore gate correctly skips a commit GitHub has not reported a check for
      # yet, so the deploy that serves is the one the step above asks for.
      #
      # THE FIRST REASON GIVEN FOR MOVING THEM WAS WRONG and is recorded in
      # `scripts/await-deploy.mjs`: a hook deployment DOES emit that event, five
      # or six minutes later, and that workflow was working. What survives is
      # that the event is late and its timing is Vercel's, so a
      # push-and-walk-away leaves minutes in which nothing has checked; and that
      # it fires per deployment, so a superseded build correctly gets nothing
      # while a commit CI deployed gets a walk attributed to a run nobody was
      # watching. Here they run at a known moment, against the commit this job
      # asked Vercel for, and they fail THIS run.
      #
      # `after-deploy.yml` IS STILL THERE AS THE BACKSTOP, for a production
      # deployment CI did not trigger: a dashboard redeploy, a rollback, a hook
      # fired by hand. So an ordinary hook deploy is walked twice — noise, and
      # cheaper than a production nobody looked at.
      #
      # ONLY FROM THE PRODUCTION BRANCH. A feature branch's CI triggers no
      # production deploy, so there would be nothing to wait for and the wait
      # would always time out — a check that is red on every branch is a check
      # people turn off.
      #
      # NO SECRET IN ANY OF THE THREE. The wait reads one meta tag off the
      # alias, `check:deployed` walks public routes, and `check:drift` reads the
      # public `/api/health` payload. That is what makes running them here
      # possible at all.
      - name: Wait for the alias to serve this commit
        if: github.ref_name == 'claude/sewax-roadmap-foundation-e4byl9'
        run: node scripts/await-deploy.mjs
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}

      # EXIT 2 IS "COULD NOT LOOK" and is the only code worth retrying: the walk
      # did not run. A genuine finding is 1 and is never retried — a check that
      # retries its way to green is not a check. The wait above has already
      # established the right build is serving, so a 2 here is a network blip.
      - name: Walk every route on the deployment that just landed
        if: github.ref_name == 'claude/sewax-roadmap-foundation-e4byl9'
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set +e
          node scripts/check-deployed.mjs
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::Could not reach the site. Retrying once in 20s."
            sleep 20
            node scripts/check-deployed.mjs
            code=$?
          fi
          exit "$code"

      # Runs even if the walk failed, which is this repository's own rule turned
      # on itself: a check that cannot pass must not silence the checks that
      # can. Drift and "the right build is serving" are independent faults and
      # one unresolved failure masking the next is the incident
      # `ACKNOWLEDGED_FAILURES` exists because of.
      - name: Compare live function fingerprints against the tree
        if: >
          always() &&
          github.ref_name == 'claude/sewax-roadmap-foundation-e4byl9'
        env:
          DRIFT_URL: ${{ vars.DEPLOY_URL }}
        run: node scripts/check-drift.mjs

  # ---------------------------------------------------------------------------
  # Dependency advisories, in a job of their own
  # ---------------------------------------------------------------------------
  #
  # A dependency with a known advisory is a way in that nobody in this
  # repository wrote, so this fails rather than printing a warning somebody
  # scrolls past — but it fails ALONE, and takes nothing down with it.
  #
  # `check:advisories` asks the question that is actually useful: not "is there
  # an advisory" — there were twenty-seven, all waiting on the Next 16 upgrade,
  # which has now landed and cleared them —
  # but "is there a NEW one, or has a known one got worse". The accepted list
  # and the reasoning are in scripts/check-advisories.mjs, and every accepted
  # entry is printed on every run so none of them becomes invisible.
  #
  # It is also in `npm run verify`, so a new advisory is found on the machine
  # that introduced it rather than by email afterwards.
  advisories:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Dependency advisories
        run: npm run check:advisories
