name: CI

# The performance guard, plus the translation guard. `npm run build` enforces
# the bundle budget (Vercel runs it too, so a regression cannot deploy); the
# paint check runs here because it needs a browser, which Vercel's builder does
# not have; and the message check catches a key that exists in one language and
# not the other, which next-intl renders as a raw key path rather than failing.
#
# TWO JOBS, AND THE SPLIT IS THE LESSON. The advisory gate used to be the sixth
# step of this one job. On 2026-09-10 a CRITICAL advisory landed in Next 14,
# fixable only by the Next 16 major upgrade — so that step failed, and every
# step below it stopped running: lint, typecheck, the message and transition
# checks, the tests, the build, the paint check, the flow check. Nine days and
# seventy-one runs, all red at 37 seconds, while the notification emails kept
# arriving and said nothing about which check had actually failed.
#
# A check that cannot pass must not be able to silence the checks that can. So
# the advisories run in a job of their own: `verify` going red now means
# something is wrong with the code, which is the only reason to look at it.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Fails if en.json and ne.json disagree on a key or a placeholder.
      - name: Message catalogues
        run: npm run check:messages

      # The other half, and the half that caught a key path printed onto a
      # live admin screen: a key absent from BOTH catalogues agrees perfectly,
      # so check:messages passes it. This resolves every t() call through the
      # TypeScript AST and asserts the copy exists.
      - name: Message keys
        run: npm run check:keys

      # The status machine exists in TypeScript and in SQL. This fails if they
      # ever disagree about what a booking may do.
      - name: Status transitions
        run: npm run check:transitions

      # Unit tests plus the database suite. The db half stands up a throwaway
      # Postgres and applies the real migrations, so RLS isolation between two
      # customers is asserted against actual policies rather than a mock.
      # ubuntu-latest ships the server binaries; the harness drops to the
      # unprivileged `postgres` account because Postgres refuses to run as root.
      - name: Tests
        run: npm run test

      # Reports the register of mock claims still on the live site. Only a
      # build failure when LAUNCH=true and NODE_ENV=production, so CI sees the
      # list without blocking ordinary work.
      - name: Launch blockers
        run: npm run check:blockers

      # Fails if First Load JS on any budgeted route is over its ceiling.
      # See scripts/perf-budget.mjs.
      - name: Build (enforces the bundle budget)
        run: npm run build

      # Fails if any front door, in either language, never records a
      # first-contentful-paint — the signature of content hidden behind an
      # entrance animation.
      - name: Paint check
        run: npm run check:paint
        env:
          PERF_CHROME_PATH: /usr/bin/google-chrome

      # The booking funnel in a real browser: the logged-out customer who fills
      # in three screens, signs in, and must come back to all of it.
      - name: Booking flows
        run: npm run check:flows

  # ---------------------------------------------------------------------------
  # Dependency advisories, in a job of their own
  # ---------------------------------------------------------------------------
  #
  # A dependency with a known advisory is a way in that nobody in this
  # repository wrote, so this fails rather than printing a warning somebody
  # scrolls past — but it fails ALONE, and takes nothing down with it.
  #
  # `check:advisories` asks the question that is actually useful: not "is there
  # an advisory" — there are twenty-seven, all waiting on one major upgrade —
  # but "is there a NEW one, or has a known one got worse". The accepted list
  # and the reasoning are in scripts/check-advisories.mjs, and every accepted
  # entry is printed on every run so none of them becomes invisible.
  #
  # It is also in `npm run verify`, so a new advisory is found on the machine
  # that introduced it rather than by email afterwards.
  advisories:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Dependency advisories
        run: npm run check:advisories
