name: After a production deploy

# The two checks that can only run against a deployment, and nothing else here.
#
# TWO JOBS RATHER THAN TWO STEPS, and that is this file's own rule applied to
# itself: a check that cannot pass must not silence the checks that can. As
# steps in one job, a drift failure would stop the deploy check ever running,
# and "production is serving last week's build" would go unnoticed for exactly
# as long as the drift took to fix. They share the gate and nothing else.
#
# Does the live database still hold the functions the deployed build shipped?
#
# WHY A WORKFLOW OF ITS OWN, AND WHY ON A DEPLOYMENT EVENT. The comparison only
# makes sense against a deployment: the tree's fingerprints are in the repo, the
# live ones are behind the running app, and `verify` finishes before anything is
# deployed. So this waits for the deployment Vercel reports and asks the build
# that is actually serving.
#
# WHAT IT IS FOR. `db.functions` on `/api/health` had been comparing the two
# since the day it shipped, and it caught real drift:
# `enforce_booking_immutability` in production had been rebuilt from a stale
# copy, losing the guard that stops a signed-in customer writing `billable` on
# their own pending booking, the reassignment ban and the `provider_serves`
# coverage check. Nothing happened for weeks, because the endpoint was already
# red over the ungotten SMS gateway — one unresolved failure masking the next.
# A finding whose only channel is a health line nobody reads is not a finding.
#
# SEPARATE FROM `verify` FOR THE REASON THAT FILE RECORDS. A check that cannot
# pass must not silence the checks that can: the advisory gate was once the
# sixth step of one job, a CRITICAL advisory landed with no fix, and nine days
# of lint, typecheck and tests never ran. This can only fail for one reason, and
# that reason is worth its own red tick.
#
# NO SECRET. It reads the public `/api/health` payload rather than the database,
# so there is no service-role key here and no Vercel token. The comparison runs
# inside the deployment, in `lib/data/schema-drift.ts`, which is also what the
# nightly cron calls — one implementation, so CI and the cron cannot disagree
# about what drift means.
on:
  deployment_status:

jobs:
  fingerprints:
    # Only a deployment that actually came up, and only production — a preview
    # points at the same database, so checking one would report the same answer
    # twice and make a preview's red tick look like a production fault.
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm ci`: the script is plain Node with no imports beyond
      # `node:process`, and installing the tree here would be a minute spent on
      # nothing. It self-tests its own rule before it makes the request.
      - name: Compare live function fingerprints against the tree
        run: node scripts/check-drift.mjs "${{ github.event.deployment_status.target_url }}"

  deployed:
    # The same gate, and deliberately a sibling of `fingerprints` rather than a
    # step inside it — see the header.
    if: >
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest

    steps:
      # PINNED TO THE DEPLOYED COMMIT, not to the branch tip. The whole question
      # this check asks is "is the commit I have the commit that is serving", and
      # it answers it with `git rev-parse HEAD` against the live build stamp. A
      # default checkout would be whatever the branch points at by the time the
      # runner starts, so a push landing during a deploy would report a false
      # "the deploy has not landed" — the check crying wolf about the one fact it
      # exists to establish.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # THE PRODUCTION ALIAS, NEVER `target_url`. Vercel reports the
      # per-deployment URL there, which is right for the drift job — it reads
      # `/api/health` and any URL serving that build answers the same — and wrong
      # here: this check asserts `og:url` matches the host, and `og:url` comes
      # from NEXT_PUBLIC_SITE_URL, which is the production domain. Walking the
      # deployment URL would fail that assertion on every single run.
      #
      # It is also the honest target. "Pushed is not deployed" is a statement
      # about what the ALIAS serves — four commits once sat on the branch while
      # production served an older build — and a per-deployment URL cannot be
      # wrong about that by construction.
      #
      # `vars.DEPLOY_URL` is for a custom domain later; unset it falls through to
      # the script's own default, so the origin stays in one place.
      #
      # EXIT 2 IS "COULD NOT LOOK" and is the only code worth retrying: the walk
      # did not run, which on a real network means the alias had not flipped yet.
      # A genuine failure is 1 and is never retried — a check that retries its way
      # to green is not a check.
      - name: Walk every route on the deployment that just landed
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set +e
          node scripts/check-deployed.mjs
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::Could not reach the site — the alias may not have flipped yet. Retrying once in 20s."
            sleep 20
            node scripts/check-deployed.mjs
            code=$?
          fi
          exit "$code"
