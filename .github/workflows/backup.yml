# Nightly encrypted database backup.
#
# WHAT THIS IS AND, MORE IMPORTANTLY, WHAT IT IS NOT. Supabase's own backups are
# the primary copy and this does not replace them: on the free plan those are
# daily, retained briefly, and live inside the account that would be lost in the
# one scenario an off-site copy exists for — a billing lapse, a deleted project,
# a compromised dashboard login. This is the second copy, in a different
# provider's storage, readable with a key that provider does not have.
#
# IT IS NOT AN ARCHIVE EITHER. GitHub deletes artifacts after their retention
# window and deletes all of them with the repository, so the longest this holds
# anything is 90 days. Anything that must outlive that gets downloaded and kept
# somewhere a person chooses; `docs/BACKUPS.md` says so in the same breath as
# the restore steps, because a backup policy nobody can state is one nobody has.
#
# THE RESTORE IS PROVEN BY A TEST, NOT BY THIS FILE RUNNING GREEN.
# `tests/db/backup-restore.test.ts` takes a dump of a real schema, seals it,
# refuses the wrong key, opens it and restores it into a scratch database — and
# reads this file to check the flags that decide whether a dump is restorable
# appear in both. A backup nobody has restored is a belief.

name: Nightly backup

on:
  schedule:
    # 19:15 UTC — 01:00 in Kathmandu, which is the quietest hour for this
    # product and well clear of the 03:00–04:00 UTC window the Vercel crons use.
    # Not on the hour: GitHub delays scheduled runs under load, and :00 is when
    # every repository on the platform asks at once.
    - cron: "15 19 * * *"
  # Runnable on demand, because the first thing anybody wants after changing
  # the key or the connection string is to know whether it still works.
  workflow_dispatch:

concurrency:
  # Two dumps of the same database at once is wasted load on a small instance
  # and two artifacts nobody can tell apart.
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # A dump of a database this size is minutes, not hours. The cap is here so
    # a hung connection fails loudly tonight instead of burning the free
    # minutes allowance until somebody notices the bill.
    timeout-minutes: 30

    # THE SCRATCH DATABASE THE ARTIFACT IS RESTORED INTO. A backup nobody has
    # restored is a file, not a backup — and until this existed the only restore
    # this product had ever done was in `tests/db/backup-restore.test.ts`, against
    # a dump of the TEST cluster taken with different flags, which is a drill
    # proving a property the real artifact did not have.
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: drill
        # 5433 on the host, so nothing collides with a client's own default.
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # THE RUNNER SHIPS postgresql-client-16 AND SUPABASE RUNS 17.
      #
      # `pg_dump` refuses a server newer than itself — "server version
      # mismatch", every night, with no partial file to misread as success. The
      # tempting fix is `--no-version-check`, which does not exist; the other
      # tempting fix is an older client with `--ignore-version`, which produces
      # a dump silently missing object types the newer server has. So the
      # client comes from PGDG and the major version is pinned to the server's.
      - name: Install a client that matches the server
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Refuse to run with no key
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # CHECKED BEFORE THE DUMP, NOT AFTER. With no key the sealing step
          # fails having already written a plaintext dump to the runner's disk,
          # and a later step with a loose glob is how that gets uploaded. The
          # job that cannot encrypt must not produce anything to encrypt.
          missing=""
          [ -n "${BACKUP_ENCRYPTION_KEY:-}" ] || missing="$missing BACKUP_ENCRYPTION_KEY"
          [ -n "${SUPABASE_DB_URL:-}" ] || missing="$missing SUPABASE_DB_URL"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing — see docs/BACKUPS.md"
            exit 1
          fi

      - name: Dump and seal
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          # THE WORKSPACE IS NOT A SAFE PLACE FOR EITHER FILE. It is a git
          # checkout, so a plaintext dump there is one `git add -A` away from a
          # commit, and the key is one `actions/upload-artifact` glob away from
          # publication. RUNNER_TEMP is outside the checkout and is destroyed
          # with the runner.
          out="$RUNNER_TEMP/sajilokaam-$stamp.dump"
          key="$RUNNER_TEMP/backup.key"
          printf '%s' "$BACKUP_ENCRYPTION_KEY" > "$key"
          chmod 600 "$key"

          # -Fc: a custom-format archive. A plain .sql file is one long
          # transaction that stops at the first error and leaves a half-built
          # database with no way to resume; this one restores selectively and
          # reorders itself to satisfy dependencies.
          #
          # --no-owner: ownership is per-project and a restore target's roles
          # are not these ones, so insisting on them fails the restore for a
          # property nothing in this product depends on.
          #
          # --no-privileges IS GONE, AND IT SHOULD NEVER HAVE BEEN HERE. It was
          # justified by "the migrations are what re-establish grants", which is
          # a sentence nobody could act on: the migrations interleave their
          # grants with `create table` inside `DO $mig$` blocks, so they cannot
          # be replayed onto a database that already has the objects. The grants
          # were therefore not re-established by anything.
          #
          # BOTH WAYS OF RESTORING WERE BROKEN BY IT, in opposite directions.
          # Into a bare cluster the product is dead — no GRANT means `42501` on
          # every read through PostgREST. Into a real Supabase project it is
          # worse than dead: that project's default ACL hands `anon` and
          # `authenticated` everything on each table as the restore creates it,
          # and the dump carried nothing to revoke it — so a recovery would undo
          # 20261011000004 and 20260927000005 silently, and the first sign would
          # be a customer writing their own `profiles.role`.
          #
          # The drill below is what keeps this honest: it asserts a restored
          # `profiles.full_name` is writable by `authenticated` and a restored
          # `profiles.role` is not.
          /usr/lib/postgresql/17/bin/pg_dump \
            --dbname="$SUPABASE_DB_URL" \
            --format=custom \
            -Fc \
            --no-owner \
            --file="$out"

          ls -l "$out"

          gpg --batch --yes --quiet \
            --symmetric --cipher-algo AES256 \
            --passphrase-file "$key" \
            -o "$out.gpg" "$out"

          # THE PLAINTEXT IS REMOVED BEFORE ANY UPLOAD STEP EXISTS, rather than
          # trusting the glob below to exclude it.
          shred -u "$out" "$key" 2>/dev/null || rm -f "$out" "$key"

          echo "artifact=$out.gpg" >> "$GITHUB_ENV"
          echo "name=sajilokaam-db-$stamp" >> "$GITHUB_ENV"

      - name: Prove it is sealed
        run: |
          set -euo pipefail
          # THE DRILL'S OWN ASSERTION, against the real artifact. gpg reads the
          # header without the key: an encrypted file names its cipher and says
          # it is "encrypted with 1 passphrase", a plaintext one answers "no
          # valid OpenPGP data found".
          #
          # THE OUTPUT IS CAPTURED RATHER THAN PIPED, because `--list-packets`
          # on a symmetric file EXITS NON-ZERO — it prints the header, then
          # tries to decrypt, fails for want of a passphrase and returns 1.
          # Piped under `set -euo pipefail` that failed the job after writing a
          # perfectly good backup. Caught by tests/db/backup-restore.test.ts
          # before this ever ran.
          packets="$(gpg --batch --list-packets "$artifact" 2>&1 || true)"
          echo "$packets" | head -3
          echo "$packets" | grep -qi "encrypted data"
          echo "$packets" | grep -qi "passphrase"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.name }}
          path: ${{ env.artifact }}
          # 90 is GitHub's maximum. It is a ceiling, not a policy — see the
          # header and docs/BACKUPS.md.
          retention-days: 90
          # A missing file must fail the job. The default warns and goes green,
          # which is a nightly tick for a backup that does not exist.
          if-no-files-found: error
          # Already compressed by pg_dump and then sealed by gpg.
          compression-level: 0

      # RESTORED AFTER THE UPLOAD, NEVER BEFORE IT, and the order is this step's
      # whole safety. A drill that fails must not cost us the artifact it was
      # drilling: upload first, restore second, so a red job means "the backup
      # exists and could not be restored" — which is the sentence somebody needs.
      # The other order loses a good dump to a bad assertion. Same reasoning as
      # the trip-compensation ledger row being written before the claim is marked.
      #
      # AGAINST THE SEALED FILE, never the plaintext, which the dump step
      # shredded and which no longer exists. So this walks the whole chain a real
      # recovery walks: the artifact opens with the key we hold, and what comes
      # out is a database.
      - name: Restore it into a scratch database
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          PGPASSWORD: drill
          PGHOST: localhost
          PGPORT: "5433"
          PGUSER: postgres
        run: |
          set -euo pipefail

          # EVERY FAILURE SAYS WHICH COMMAND IT WAS, and this is the general
          # version of the lesson the preflight below only half learned.
          #
          # The drill exited 127 twice. The first time there was nothing to go on
          # at all; the second time a preflight had been added that names a
          # missing binary — and it reported nothing, because the binaries were
          # all present and the failure was somewhere after it. Fixing one CLASS
          # of opaque failure leaves the next one just as opaque, and each round
          # costs a full run to learn one fact.
          #
          # An `::error::` line on stdout becomes a GitHub annotation, which the
          # API serves. The job log does not: it lives on a storage host the agent
          # sandbox cannot reach, so for this session a failure that only writes
          # to the log has not said anything. The trap puts the line number, the
          # exit code and the command itself where they can actually be read.
          trap 'code=$?; echo "::error::restore drill failed at line $LINENO (exit $code): $BASH_COMMAND"' ERR

          # THE BINARIES, NAMED BEFORE THEY ARE USED. The first version hardcoded
          # `/usr/lib/postgresql/17/bin/psql` and the step exited 127 — "command
          # not found" — which GitHub reports as a bare `Process completed with
          # exit code 127` with the log on a host the agent sandbox cannot read.
          # So the failure said nothing about which binary was missing, and the
          # only way to find out was another run.
          #
          # PATH RATHER THAN AN ABSOLUTE PATH, because the version directory is
          # the packaging's business and not this script's, and a preflight that
          # names the missing tool turns an opaque 127 into a sentence. Printed
          # every run, not only on failure: a list of what is actually installed
          # is what the next person needs when this breaks again.
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          echo "client binaries in /usr/lib/postgresql/17/bin:"
          ls -1 /usr/lib/postgresql/17/bin 2>/dev/null || echo "  (no such directory)"
          missing=""
          for b in psql pg_restore createdb gpg; do
            command -v "$b" >/dev/null 2>&1 || missing="$missing $b"
          done
          if [ -n "$missing" ]; then
            echo "::error::the restore drill needs these and the runner has none of them:$missing"
            exit 1
          fi

          psql=psql
          key="$RUNNER_TEMP/restore.key"
          opened="$RUNNER_TEMP/opened.dump"

          printf '%s' "$BACKUP_ENCRYPTION_KEY" > "$key"
          chmod 600 "$key"
          gpg --batch --yes --quiet --decrypt \
            --passphrase-file "$key" -o "$opened" "${{ env.artifact }}"
          shred -u "$key" 2>/dev/null || rm -f "$key"

          # THE ROLES FIRST, OR EVERY GRANT IN THE DUMP IS AN ERROR. A grant names
          # its role by name, so restoring into a cluster that has never heard of
          # `authenticated` drops exactly the lines this drill exists to check —
          # and drops them as warnings, which read like success.
          "$psql" -v ON_ERROR_STOP=1 -d postgres -c "
            do \$\$
            declare r text;
            begin
              foreach r in array array[
                'anon','authenticated','service_role','authenticator',
                'supabase_admin','supabase_auth_admin','supabase_storage_admin',
                'supabase_read_only_user','supabase_replication_admin',
                'dashboard_user','pgbouncer'
              ] loop
                if not exists (select 1 from pg_roles where rolname = r) then
                  execute format('create role %I nologin', r);
                end if;
              end loop;
            end
            \$\$;"

          "$psql" -v ON_ERROR_STOP=1 -d postgres -c "create database restore_drill"
          "$psql" -v ON_ERROR_STOP=1 -d restore_drill -c "
            create extension if not exists pgcrypto;
            create extension if not exists \"uuid-ossp\";"

          # `-n public` BECAUSE THAT IS WHAT THIS PRODUCT OWNS. `auth` and
          # `storage` are Supabase's and depend on extensions a vanilla cluster
          # does not ship, so restoring them would bury this result in noise
          # about somebody else's schema.
          #
          # DIAGNOSTICS ARE COUNTED, NOT FATAL: a dump of a managed database
          # always references something a bare cluster lacks. The verdict is the
          # assertions below, which is the drill's own rule — a clean exit from a
          # restore that brought back nothing would pass, and does not.
          pg_restore \
            -d restore_drill -n public --no-owner "$opened" \
            2>"$RUNNER_TEMP/restore.err" || true
          echo "restore diagnostics: $(wc -l < "$RUNNER_TEMP/restore.err") line(s)"
          tail -20 "$RUNNER_TEMP/restore.err" || true

          q () { "$psql" -tAX -d restore_drill -c "$1" | tr -d '[:space:]'; }

          tables=$(q "select count(*) from information_schema.tables where table_schema='public'")
          policies=$(q "select count(*) from pg_policies where schemaname='public'")
          triggers=$(q "select count(*) from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and not t.tgisinternal")
          functions=$(q "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'")
          echo "restored: $tables tables, $policies policies, $triggers triggers, $functions functions"

          # A RESTORE THAT BROUGHT BACK THE DATA AND NOT THE RULES is the
          # quietest possible disaster: the product runs, every page renders, and
          # the triggers, the policies and the append-only guards are simply gone.
          [ "$tables"    -gt 30 ] || { echo "::error::only $tables tables came back"; exit 1; }
          [ "$policies"  -gt 20 ] || { echo "::error::only $policies policies came back"; exit 1; }
          [ "$triggers"  -gt 5  ] || { echo "::error::only $triggers triggers came back"; exit 1; }
          [ "$functions" -gt 5  ] || { echo "::error::only $functions functions came back"; exit 1; }

          # THE GRANTS, AND THIS PAIR IS WHY THE STEP EXISTS. One asserts they
          # restored AT ALL — `full_name` is a column a browser legitimately
          # writes, so a dump carrying no ACL fails here. The other asserts they
          # restored NARROWLY: `role` is the escalation that one PATCH away made
          # any signed-in customer an admin, and a restore that hands it back
          # writable has undone the fix while looking like a successful recovery.
          full_name=$(q "select has_column_privilege('authenticated','public.profiles','full_name','UPDATE')")
          role_col=$(q "select has_column_privilege('authenticated','public.profiles','role','UPDATE')")
          echo "grants: profiles.full_name UPDATE=$full_name  profiles.role UPDATE=$role_col"
          [ "$full_name" = "t" ] || { echo "::error::the dump carried no grants — profiles.full_name came back unwritable"; exit 1; }
          [ "$role_col"  = "f" ] || { echo "::error::profiles.role came back writable by authenticated"; exit 1; }

          echo "Restore drill passed against the artifact this run produced."
